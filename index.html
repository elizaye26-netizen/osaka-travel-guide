let curDay='day1', curTab='route', curStage='before';
let lightboxItems=[], lightboxIndex=0, touchStartX=null, touchMoved=false, imageClickTimer=null;
const lightbox=document.getElementById('lightbox');
const lightboxImage=document.getElementById('lightboxImage');
function showLightbox(){
  const item=lightboxItems[lightboxIndex]; if(!item)return;
  lightboxImage.src=IMG(item.src); lightboxImage.alt=item.label;
  lightboxImage.classList.remove('zoomed');
  document.getElementById('lightboxTitle').textContent=item.label;
  document.getElementById('lightboxCount').textContent=(lightboxIndex+1)+' / '+lightboxItems.length;
  document.getElementById('lightboxPrev').style.display=lightboxItems.length>1?'grid':'none';
  document.getElementById('lightboxNext').style.display=lightboxItems.length>1?'grid':'none';
}
function openLightbox(items,index){lightboxItems=items;lightboxIndex=index;showLightbox();lightbox.classList.add('open');document.body.style.overflow='hidden'}
function closeLightbox(){lightbox.classList.remove('open');document.body.style.overflow=''}
function moveLightbox(step){if(lightboxItems.length<2)return;lightboxIndex=(lightboxIndex+step+lightboxItems.length)%lightboxItems.length;showLightbox()}
document.getElementById('lightboxClose').onclick=closeLightbox;
document.getElementById('lightboxPrev').onclick=e=>{e.stopPropagation();moveLightbox(-1)};
document.getElementById('lightboxNext').onclick=e=>{e.stopPropagation();moveLightbox(1)};
lightbox.onclick=e=>{if(e.target===lightbox||e.target===document.getElementById('lightboxStage'))closeLightbox()};
lightboxImage.onclick=e=>{e.stopPropagation();if(touchMoved){touchMoved=false;return}clearTimeout(imageClickTimer);imageClickTimer=setTimeout(closeLightbox,250)};
lightboxImage.ondblclick=e=>{e.stopPropagation();clearTimeout(imageClickTimer);lightboxImage.classList.toggle('zoomed')};
document.getElementById('lightboxStage').ontouchstart=e=>{touchStartX=e.touches[0]?.clientX??null;touchMoved=false};
document.getElementById('lightboxStage').ontouchmove=e=>{if(touchStartX===null)return;const delta=(e.touches[0]?.clientX??touchStartX)-touchStartX;if(Math.abs(delta)>12)touchMoved=true};
document.getElementById('lightboxStage').ontouchend=e=>{if(touchStartX===null)return;const delta=(e.changedTouches[0]?.clientX??touchStartX)-touchStartX;if(Math.abs(delta)>45){touchMoved=true;moveLightbox(delta>0?-1:1)}touchStartX=null};
document.addEventListener('keydown',e=>{if(!lightbox.classList.contains('open'))return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowLeft')moveLightbox(-1);if(e.key==='ArrowRight')moveLightbox(1)});

  document.querySelectorAll('#route .route-head').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));
  document.querySelectorAll('#route .route-media').forEach(b=>b.onclick=()=>{const routeIndex=Number(b.dataset.group);const item=d.route[routeIndex];openLightbox((item.img||[]).map(src=>({src,label:item.title})),Number(b.dataset.index))});
}

function restCard(r){
  const tagHtml=r.tags.map(t=>`<span class="${r.notKaiseki?'not-kaiseki':''}">${esc(t)}</span>`).join('');
  const imgHtml=r.img?`<div class="rest-imgs ${r.img.length===1?'single':''}">${r.img.map(im=>`<img src="${IMG(im)}" alt="${esc(r.name)}" loading="lazy">`).join('')}</div>`:'';
  const rows=[
    ['地址与交通',r.address+'；'+r.access],
    ['营业',r.hours],
    ['预约',r.reservation],
    ['预算',r.budget],
    ['推荐',r.recommendation],
    ['评价',r.reviews],
    ['使用建议',r.advice]
  ].map(([k,v])=>`<li><b>${k}：</b>${esc(v)}</li>`).join('');
  const links=r.links.map(l=>`<a class="btn secondary" target="_blank" rel="noopener" href="${l[1]}">${esc(l[0])}</a>`).join('');
  return `<article class="rest-card"><div class="rest-head"><span class="tagline">${esc(r.tagline)}</span><h3>${esc(r.name)}</h3><p class="cn">${esc(r.cn)}</p><div class="rest-tags">${tagHtml}${r.notKaiseki?'<span class="not-kaiseki">不是怀石</span>':''}</div></div>${imgHtml}<div class="rest-body"><ul>${rows}</ul><div class="actions"><a class="btn" target="_blank" rel="noopener" href="${mapUrl(r.map)}">Google 地图</a>${links}</div></div></article>`;
}

function renderRestaurants(d){
  document.getElementById('restTitle').textContent=d.restTitle||'餐厅';
  document.getElementById('restSub').textContent=d.restSub||'';
  // group by r.group if present
  const groupsSeen=[]; const byGroup={};
  d.restaurants.forEach(r=>{const g=r.group||'推荐'; if(!byGroup[g]){byGroup[g]=[];groupsSeen.push(g)} byGroup[g].push(r)});
  let html='';
  groupsSeen.forEach(g=>{
    html+=`<div class="group-divider">${esc(g)}</div>`+byGroup[g].map(restCard).join('');
  });
  document.getElementById('restaurantList').innerHTML=html;
  document.querySelectorAll('#restaurantList .rest-card').forEach(card=>{
    const title=card.querySelector('h3')?.textContent||'餐厅照片';
    const imgs=[...card.querySelectorAll('.rest-imgs img')];
    const items=imgs.map(img=>({src:img.getAttribute('src').replace(/^assets\//,''),label:title}));
    imgs.forEach((img,index)=>{img.style.cursor='zoom-in';img.onclick=()=>openLightbox(items,index)});
  });
}

      document.getElementById('shopSub').textContent='难波—心斋桥沿线商场楼层攻略。';
    }
    c.innerHTML='<div class="shop-list">'+d.shopGroups.map(g=>`<section class="shop-group"><div class="shop-group-title">${esc(g.title)}</div><ul>${g.items.map(it=>`<li>${esc(it)}</li>`).join('')}</ul></section>`).join('')+'</div>';
  }
}

function renderPhotos(d){
  const items=[];
  d.route.forEach(r=>{ if(r.img) r.img.forEach(im=>items.push({src:im,label:r.title})) });
  d.restaurants.forEach(r=>{ if(r.img) r.img.forEach(im=>items.push({src:im,label:r.name})) });
  document.getElementById('photoSub').textContent=`共 ${items.length} 张实拍；点击全屏查看，左右滑动切换。地点导航请使用行程页的 Google 地图按钮。`;
  document.getElementById('photoGrid').innerHTML=items.map((it,i)=>`<button type="button" class="photo ${i===0?'wide':''}" data-index="${i}"><img src="${IMG(it.src)}" alt="${esc(it.label)}" loading="lazy"><span>${esc(it.label)}</span></button>`).join('');
  document.querySelectorAll('#photoGrid .photo').forEach(b=>b.onclick=()=>openLightbox(items,Number(b.dataset.index)));
}

function checkbox(key,label,extra=''){
  const checked=saved[key]??preset.has(label);
  return `<label class="check-row"><input type="checkbox" data-key="${esc(key)}" ${checked?'checked':''}><span><strong>${esc(label)}</strong>${extra}</span></label>`;
}
function bindChecks(){document.querySelectorAll('input[data-key]').forEach(x=>x.onchange=()=>{saved[x.dataset.key]=x.checked;try{localStorage.setItem('osaka-guide-checks',JSON.stringify(saved))}catch(e){}})}
function renderGroups(stage){
  document.getElementById('checkGroups').innerHTML=`<div class="check-stage active">${groups[stage].map((g,gi)=>`<section class="group"><div class="group-title"><span>${esc(g[0])}</span><span>${g[1].filter((x,i)=>saved[stage+'-'+gi+'-'+i]??preset.has(x)).length}/${g[1].length}</span></div>${g[1].map((x,i)=>checkbox(stage+'-'+gi+'-'+i,x)).join('')}</section>`).join('')}</div>`;
  bindChecks();
}

function renderAll(){
  const d=DAYS[curDay];
  document.getElementById('heroTitle').textContent=d.title;
  document.getElementById('heroChip').textContent=d.chip;
  document.getElementById('heroDate').textContent=d.date;
  document.getElementById('heroSummary').textContent=d.summary;
  document.title='大阪旅行攻略 · '+d.chip;
  renderRoute(d);
  renderRestaurants(d);
  renderShopping(d);
  renderPhotos(d);
}

/* ===== 事件绑定 ===== */
document.querySelectorAll('.daybtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.daybtn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  curDay=b.dataset.day;
  renderAll();
});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); curTab=b.dataset.tab;
  document.getElementById(curTab).classList.add('active');
  window.scrollTo({top:0});
});
document.querySelectorAll('.stage').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.stage').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); curStage=b.dataset.stage;
  renderGroups(curStage);
});

renderAll();
renderGroups('before');
</script>
</body>
</html>
